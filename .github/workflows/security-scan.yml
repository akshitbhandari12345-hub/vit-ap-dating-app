name: Automated CI/CD Security & Vulnerability Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Dependency Vulnerability Scanning (npm audit)
  dependency-vulnerability-scan:
    name: 🛡️ Dependency CVE Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit Frontend Dependencies
        run: |
          echo "Scanning frontend dependencies for known CVE vulnerabilities..."
          npm audit --audit-level=high || true

      - name: Audit Backend API Gateway Dependencies
        run: |
          echo "Scanning backend dependencies for known CVE vulnerabilities..."
          cd server
          npm audit --audit-level=high || true

  # Job 2: Secret & Credential Leak Scanning (TruffleHog / Secret Scanner)
  secret-leak-prevention-scan:
    name: 🔑 Secret & Credential Leak Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog-actions-scan@v3.88.15
        with:
          extra_args: --only-verified

  # Job 3: DAST Security Scanning (OWASP ZAP Automated Scan)
  dast-security-scan:
    name: ⚡ OWASP ZAP DAST Security Scan
    runs-on: ubuntu-latest
    needs: [dependency-vulnerability-scan]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Express Zero-Trust Backend Gateway
        run: |
          cd server
          npm install
          npm start &
          sleep 5

      - name: Run OWASP ZAP Baseline Security Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5000/api/health'
          fail_action: false
          token: ${{ secrets.GITHUB_TOKEN }}
